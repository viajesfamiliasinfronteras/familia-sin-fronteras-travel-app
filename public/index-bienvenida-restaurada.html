<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4ecd9">
<title>Familia Sin Fronteras Travel App</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:#f4ecd9;
  color:#111;
  font-family:Arial,Helvetica,sans-serif
}
body{display:flex;justify-content:center}
.screen{
  position:relative;
  width:min(100vw,430px);
  aspect-ratio:430/746;
  min-height:0;
  overflow:hidden;
  background:#f4ecd9;
}
.bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center top;
  display:block;
  pointer-events:none;
}
.tagline{
  position:absolute;
  z-index:5;
  top:53%;
  left:8%;
  right:8%;
  text-align:center;
  font-family:"Courier New",Courier,monospace;
  font-size:clamp(13px,3.5vw,15px);
  line-height:1.1;
  font-weight:700;
}
.actions{
  position:absolute;
  z-index:10;
  top:60%;
  left:7%;
  right:7%;
  display:grid;
  gap:12px;
}
.actions a{
  position:relative;
  z-index:11;
  height:58px;
  border:3px solid #111;
  border-radius:20px;
  display:grid;
  place-items:center;
  text-decoration:none;
  color:#111;
  font-size:clamp(15px,4vw,18px);
  font-weight:900;
  cursor:pointer;
  pointer-events:auto;
}
.create{background:#df653b}
.login{background:#f5ecde}
</style>
</head>
<body>
<main class="screen">
  <img class="bg" src="/welcome-bg.jpg" alt="">
  <div class="tagline">Tu asistente de viaje grupal</div>

  <div class="actions">
    <a class="create" href="/crear-cuenta.html">CREAR USUARIO</a>
    <a class="login" href="/login.html">YA TENGO UNA CUENTA</a>
  </div>
</main>
</body>
</html>
