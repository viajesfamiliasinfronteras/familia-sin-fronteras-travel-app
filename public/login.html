<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="/app.css"><title>Ingresar</title><style>.login{padding:28px 24px;min-height:100svh}.login h1{font-size:46px;margin:76px 0 28px}.login form{display:grid;gap:14px}.login .back-btn{position:absolute;top:18px;left:18px}.error{font-size:13px;font-weight:700;color:#a93020;text-align:center;min-height:18px}</style></head><body><main class="app login"><a class="back-btn" href="/">‹</a><h1 class="retro-title">Hola de nuevo</h1><form id="login"><input class="field" id="whatsapp" placeholder="WhatsApp" inputmode="tel" required><input class="field" id="password" type="password" placeholder="Contraseña" required><div class="error" id="error"></div><button class="primary">ENTRAR</button></form></main><script src="/app.js"></script><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();const s=FSF.readState();const w=document.getElementById('whatsapp').value.trim();const p=document.getElementById('password').value;if(!s.userCreated){document.getElementById('error').textContent='Primero crea tu usuario en este dispositivo.';return}const h=await FSF.hashPassword(p,s.passwordSalt||'');if(w!==s.whatsapp||h!==s.passwordHash){document.getElementById('error').textContent='WhatsApp o contraseña incorrectos.';return}FSF.writeState({loggedIn:true});location.href=s.tripId?'/mi-perfil':'/elegir-viaje'};</script></body></html>
