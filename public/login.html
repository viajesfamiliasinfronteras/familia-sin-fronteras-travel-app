<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hola de nuevo</title>
<link rel="stylesheet" href="/styles.css">
<style>
html,body{margin:0;min-height:100%;background:#f4eadb}
body{display:flex;justify-content:center}
.login{position:relative;width:min(100vw,430px);min-height:100svh;margin:0 auto;padding:22px 24px 50px;background:#f4eadb;overflow:hidden}
.grid{position:absolute;left:0;right:0;top:0;height:310px;opacity:.38;background:repeating-linear-gradient(90deg,transparent 0 52px,#da6d45 53px 56px),repeating-linear-gradient(0deg,transparent 0 52px,#da6d45 53px 56px)}
.content{position:relative;z-index:2}
.back{width:46px;height:46px;border:2.5px solid #151515;border-radius:16px;background:#f3eadc;display:grid;place-items:center;font-size:22px;text-decoration:none;color:#151515}
h1{margin:94px 0 8px;text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:42px;line-height:1;font-weight:900}
.sub{margin:0 0 28px;text-align:center;font-family:"Courier New",Courier,monospace;font-weight:700}
form{display:grid;gap:13px}.field{position:relative}
input{width:100%;height:58px;border:3px solid #151515;border-radius:18px;background:#f3eadc;padding:0 18px;font-size:17px;outline:none}
.eye{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:transparent;font-size:20px}
.primary{height:58px;border:3px solid #151515;border-radius:18px;background:#dc6a40;font-weight:900;font-size:17px}
.error{min-height:18px;text-align:center;font-size:13px;font-weight:700;color:#a12d20}
.wave{position:absolute;left:-30px;right:-30px;bottom:-65px;height:130px;background:#65784a;border-radius:50% 50% 0 0/45% 45% 0 0;transform:rotate(-2deg)}
</style>
</head>
<body>
<main class="login">
  <div class="grid"></div>
  <div class="content">
    <a class="back" href="/" aria-label="Volver">←</a>
    <h1>Hola de nuevo</h1>
    <p class="sub">Entra a tu viaje grupal</p>
    <form id="loginForm">
      <input id="whatsapp" value="+" placeholder="+5511999999999" inputmode="tel" autocomplete="tel" required>
      <div class="field">
        <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" required>
        <button class="eye" id="eye" type="button" aria-label="Mostrar contraseña">◉</button>
      </div>
      <div class="error" id="error"></div>
      <button class="primary" id="submitBtn" type="submit">ENTRAR</button>
    </form>
  </div>
  <div class="wave"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script src="/app.js"></script>
<script>
const phone=document.getElementById('whatsapp');
const pass=document.getElementById('password');
const error=document.getElementById('error');
phone.addEventListener('input',()=>{phone.value=FSFCLOUD.normalizePhone(phone.value)});
document.getElementById('eye').onclick=()=>{pass.type=pass.type==='password'?'text':'password'};
async function legacyHash(password,salt){
  const data=new TextEncoder().encode(salt+'::'+password);
  const digest=await crypto.subtle.digest('SHA-256',data);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function legacySalt(){
  if(crypto.randomUUID)return crypto.randomUUID();
  const arr=new Uint32Array(4);crypto.getRandomValues(arr);return Array.from(arr).join('-');
}
async function tryLegacyLogin(whatsapp,password){
  let legacy=null;
  try{legacy=JSON.parse(localStorage.getItem('fsf_user')||'null')}catch(e){}
  if(!legacy)return null;
  if(FSFCLOUD.normalizePhone(legacy.whatsapp)!==whatsapp)return null;

  if(legacy.passwordHash && legacy.passwordSalt){
    const test=await legacyHash(password,legacy.passwordSalt);
    if(test!==legacy.passwordHash)throw new Error('Contraseña incorrecta.');
  }else{
    const salt=legacySalt();
    legacy.passwordSalt=salt;
    legacy.passwordHash=await legacyHash(password,salt);
  }

  legacy.userCreated=true;
  legacy.loggedIn=true;
  legacy.rememberMe=true;
  localStorage.setItem('fsf_user',JSON.stringify(legacy));

  const current=FSF.readState();
  const names=FSF.splitName(legacy.name||'');
  const trip=current.tripId||localStorage.getItem('fsf_trip')||'';
  return FSF.writeState({
    ...current,
    name:legacy.name||current.name||'',
    firstName:current.firstName||names.firstName,
    lastName:current.lastName||names.lastName,
    whatsapp,
    userCreated:true,
    loggedIn:true,
    rememberMe:true,
    legacyMode:true,
    tripId:trip||current.tripId||''
  });
}
document.getElementById('loginForm').onsubmit=async(e)=>{
  e.preventDefault(); error.textContent=''; submitBtn.disabled=true;
  const whatsapp=FSFCLOUD.normalizePhone(phone.value), password=pass.value;
  try{
    try{
      await FSFCLOUD.signInTraveler(whatsapp,password);
      const state=await FSFCLOUD.syncCloudState();
      FSF.writeState({legacyMode:false});
      location.replace(FSF.nextRoute(state));
      return;
    }catch(cloudErr){
      const legacyState=await tryLegacyLogin(whatsapp,password);
      if(legacyState){
        location.replace(FSF.nextRoute());
        return;
      }
      throw cloudErr;
    }
  }catch(err){
    let msg=err.message||'No pudimos iniciar sesión.';
    msg=msg.replace('Invalid login credentials','WhatsApp o contraseña incorrectos.');
    msg=msg.replace('Failed to send a request to the Edge Function','No encontramos ese usuario.');
    msg=msg.replace('Solicitud no autorizada','No encontramos ese usuario.');
    error.textContent=msg;
  }finally{submitBtn.disabled=false}
};
</script>
</body>
</html>
