<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="/app.css"><title>Perfil listo</title>
<style>
.ready{min-height:100svh;padding:22px 16px 32px;background:var(--cream);position:relative}.box{position:relative;z-index:2;border:3px solid var(--ink);border-radius:30px;background:var(--cream2);padding:24px 18px;text-align:center}.step{font:700 14px "Courier Prime",monospace}.dots{display:flex;justify-content:center;gap:16px;margin:8px 0 18px}.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);background:var(--cream2)}.dot.on:nth-child(1){background:var(--olive)}.dot.on:nth-child(2){background:var(--mustard)}.dot.on:nth-child(3){background:var(--terracotta)}.box h1{font-size:50px;margin:0 0 8px}.box p{font:700 17px "Courier Prime",monospace;margin:0}.avatar{width:190px;height:190px;border-radius:50%;margin:24px auto 20px;border:4px solid var(--ink);background:var(--olive);display:grid;place-items:center;font-size:88px;position:relative}.orbit{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:-8px}.orb{width:58px;height:58px;border:2px solid var(--ink);border-radius:50%;background:white;display:grid;place-items:center;font-size:27px}.primary{margin-top:18px;background:var(--olive);color:white}.note{text-align:center;font:700 14px "Courier Prime",monospace;margin:13px 26px 0}.grid-bg{height:100%}
</style></head><body>
<main class="app ready"><div class="grid-bg"></div><section class="box"><div class="step">Paso 3 de 4</div><div class="dots"><span class="dot on"></span><span class="dot on"></span><span class="dot on"></span><span class="dot"></span></div><h1 class="retro-title">¡Tu perfil<br>ya está listo!</h1><p>Ahora ya podemos conocerte mejor.</p><div class="avatar">☺</div><div class="orbit"><span class="orb">📷</span><span class="orb">✈️</span><span class="orb">🍜</span><span class="orb">🎵</span><span class="orb">📍</span><span class="orb">👥</span></div></section><button class="primary" id="go">CONTINUAR</button><p class="note">En el siguiente paso podrás cargar la información de tu viaje.</p></main>
<script src="/app.js"></script><script>const s=FSF.requireUser();go.onclick=()=>{FSF.writeState({profileReadySeen:true});location.href='/datos-viaje.html'+(FSF.isTour()?'?tourframe=1':'')};</script>
</body></html>
