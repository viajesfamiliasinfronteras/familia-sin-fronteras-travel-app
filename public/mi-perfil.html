<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="stylesheet" href="/app.css">
  <title>Mi perfil</title>
  <style>
    .profile{
      min-height:100svh;
      padding:12px;
      position:relative;
      background:
        linear-gradient(rgba(255,248,232,.95) 2px,transparent 2px),
        linear-gradient(90deg,rgba(255,248,232,.95) 2px,transparent 2px),
        var(--terracotta);
      background-size:46px 46px;
    }
    .profile-shell{
      position:relative;
      z-index:2;
      width:100%;
      background:var(--cream);
      border:0;
      border-radius:30px;
      padding:14px 14px 22px;
      box-shadow:none;
    }
    .profile .back-btn{
      width:42px;height:42px;
      position:relative;
      z-index:5;
      margin-bottom:8px;
    }
    .trip-badge{display:inline-flex;align-items:center;min-height:29px;padding:5px 10px;border:1.5px solid var(--ink);border-radius:999px;background:var(--mustard);font-family:"Courier Prime",monospace;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin:0 0 8px}.profile-head{
      display:grid;
      grid-template-columns:1fr auto;
      gap:12px;
      align-items:start;
      margin-bottom:16px;
    }
    .profile-copy h1{
      font-size:48px;
      margin:0;
    }
    .profile-copy p{
      margin:2px 0 0;
      font-size:16px;
    }
    .photo-upload{
      display:block;
      width:92px;
      text-align:center;
      cursor:pointer;
      user-select:none;
    }
    .photo-circle{
      width:84px;
      height:84px;
      margin:0 auto;
      border:2px dashed rgba(17,23,18,.62);
      border-radius:50%;
      background:rgba(255,255,255,.38);
      display:grid;
      place-items:center;
      overflow:hidden;
      position:relative;
    }
    .photo-circle img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:none;
    }
    .photo-placeholder{
      display:grid;
      place-items:center;
      gap:2px;
      font-weight:800;
      font-size:11px;
      line-height:1.05;
    }
    .photo-placeholder b{font-size:26px;line-height:1}
    .photo-upload input{display:none}
    .form{display:grid;gap:11px}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .group{display:grid;gap:6px}
    .chips{display:flex;gap:6px;flex-wrap:wrap}
    .interest-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
    .interest{
      min-height:56px;
      border:1.5px solid rgba(17,23,18,.68);
      border-radius:12px;
      background:rgba(255,255,255,.36);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      font-size:11px;
      padding:4px;
      text-align:center;
    }
    .interest b{font-size:21px;line-height:1.05}
    .interest.selected,
    .chip.selected{
      background:var(--terracotta);
      color:#fff;
      border-color:var(--ink);
    }
    .personality{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
    .personality .chip{padding:7px 5px;font-size:11px;text-align:center}
    .profile .primary{
      margin-top:10px;
      background:var(--olive);
      color:#fff;
      border-color:var(--olive);
      box-shadow:none;
    }
    @media(max-width:370px){
      .profile{padding:8px}
      .profile-shell{padding:12px 11px 20px}
      .profile-copy h1{font-size:44px}
      .interest-grid{grid-template-columns:repeat(4,1fr)}
      .personality{grid-template-columns:repeat(3,1fr)}
      .photo-upload{width:82px}
      .photo-circle{width:76px;height:76px}
    }
  </style>
</head>
<body>
<main class="app profile">
  <section class="profile-shell">
    <a class="back-btn" href="/elegir-viaje.html">‹</a>

    <div class="trip-badge" id="tripBadge"></div><div class="profile-head">
      <div class="profile-copy">
        <h1 class="retro-title">Mi perfil</h1>
        <p>Cuéntanos un poco sobre ti.</p>
      </div>

      <label class="photo-upload" for="profilePhoto">
        <span class="photo-circle">
          <span class="photo-placeholder" id="photoPlaceholder"><b>📷</b>Subir foto</span>
          <img id="photoPreview" alt="Foto de perfil">
        </span>
        <input id="profilePhoto" type="file" accept="image/*">
      </label>
    </div>

    <form class="form" id="profileForm">
      <div class="two">
        <div>
          <p class="small-label">Nombre</p>
          <input class="field" id="firstName" placeholder="Tu nombre">
        </div>
        <div>
          <p class="small-label">Apellido</p>
          <input class="field" id="lastName" placeholder="Tu apellido">
        </div>
      </div>

      <div>
        <p class="small-label">Nacionalidad</p>
        <input class="field" id="nationality" placeholder="Selecciona tu nacionalidad">
      </div>

      <div class="group">
        <p class="small-label">Rango de edad</p>
        <div class="chips" data-single="age">
          <button class="chip" type="button">20 - 30</button>
          <button class="chip" type="button">30 - 40</button>
          <button class="chip" type="button">40 - 50</button>
          <button class="chip" type="button">50 - 60</button>
          <button class="chip" type="button">60 - 70</button>
          <button class="chip" type="button">70+</button>
        </div>
      </div>

      <div class="group">
        <p class="small-label">¿Con quién viajas?</p>
        <div class="chips" data-single="travelWith">
          <button class="chip" type="button">Solo/a</button>
          <button class="chip" type="button">Amigos</button>
          <button class="chip" type="button">Pareja</button>
          <button class="chip" type="button">Familia</button>
          <button class="chip" type="button">Otro</button>
        </div>
      </div>

      <div class="group">
        <p class="small-label">Mis intereses</p>
        <div class="interest-grid" data-multi="interests">
          <button type="button" class="interest"><b>🍴</b>Gastronomía</button>
          <button type="button" class="interest"><b>🏛️</b>Cultura</button>
          <button type="button" class="interest"><b>⛰️</b>Naturaleza</button>
          <button type="button" class="interest"><b>🛍️</b>Compras</button>
          <button type="button" class="interest"><b>♫</b>Música</button>
          <button type="button" class="interest"><b>🎨</b>Arte</button>
          <button type="button" class="interest"><b>📷</b>Fotografía</button>
          <button type="button" class="interest"><b>📖</b>Historia</button>
          <button type="button" class="interest"><b>🌙</b>Vida nocturna</button>
          <button type="button" class="interest"><b>💬</b>Idiomas</button>
        </div>
      </div>

      <div class="group">
        <p class="small-label">Mi personalidad</p>
        <div class="personality" data-multi="personality">
          <button class="chip" type="button">Introvertido/a</button>
          <button class="chip" type="button">Extrovertido/a</button>
          <button class="chip" type="button">Tímido/a</button>
          <button class="chip" type="button">Amistoso/a</button>
          <button class="chip" type="button">Serio/a</button>
          <button class="chip" type="button">Gracioso/a</button>
          <button class="chip" type="button">Aventurero/a</button>
          <button class="chip" type="button">Tranquilo/a</button>
          <button class="chip" type="button">Estructurado/a</button>
          <button class="chip" type="button">Relajado/a</button>
          <button class="chip" type="button">Organizado/a</button>
          <button class="chip" type="button">Espontáneo/a</button>
          <button class="chip" type="button">Paciente</button>
          <button class="chip" type="button">Impaciente</button>
          <button class="chip" type="button">Rápido/a</button>
          <button class="chip" type="button">Lento/a</button>
          <button class="chip" type="button">Cariñoso/a</button>
          <button class="chip" type="button">Reservado/a</button>
        </div>
      </div>

      <div>
        <p class="small-label">Cuéntale al grupo algo sobre ti</p>
        <textarea class="field" id="about" placeholder="Escribe un poco sobre ti..."></textarea>
      </div>

      <button class="primary" type="submit">CONTINUAR</button>
    </form>
  </section>
</main>

<script src="/app.js"></script>
<script>
let state=FSF.requireUser();
function setupSingle(key,current){
  const box=document.querySelector('[data-single="'+key+'"]');
  box.querySelectorAll('button').forEach(b=>{
    if(b.textContent.trim()===current)b.classList.add('selected');
    b.onclick=()=>{box.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};
  });
}
function setupMulti(key,current){
  const box=document.querySelector('[data-multi="'+key+'"]');
  box.querySelectorAll('button').forEach(b=>{
    if((current||[]).includes(b.textContent.trim()))b.classList.add('selected');
    b.onclick=()=>b.classList.toggle('selected');
  });
}
(async()=>{
  if(!state)return;
  if(state.profileComplete&&!new URLSearchParams(location.search).has('edit')&&!FSF.isTour()){location.replace('/home.html');return}
  if(!state.tripId){location.replace('/elegir-viaje.html');return}
  tripBadge.textContent=FSF.tripLabel(state.tripId);
  firstName.value=state.firstName||''; lastName.value=state.lastName||'';
  nationality.value=state.nationality||''; about.value=state.about||'';
  setupSingle('age',state.age); setupSingle('travelWith',state.travelWith);
  setupMulti('interests',state.interests); setupMulti('personality',state.personality);
  const saved=await FSF.getLocalFile('profile:'+state.whatsapp);
  if(saved?.blob){
    const url=URL.createObjectURL(saved.blob);
    photoPreview.src=url;photoPreview.style.display='block';photoPlaceholder.style.display='none';
  }
})();
profilePhoto.onchange=()=>{
  const file=profilePhoto.files?.[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{photoPreview.src=reader.result;photoPreview.style.display='block';photoPlaceholder.style.display='none'};
  reader.readAsDataURL(file);
};
profileForm.onsubmit=async e=>{
  e.preventDefault();
  const one=k=>document.querySelector('[data-single="'+k+'"] .selected')?.textContent.trim()||'';
  const many=k=>[...document.querySelectorAll('[data-multi="'+k+'"] .selected')].map(x=>x.textContent.trim());
  const existing=await FSF.getLocalFile('profile:'+state.whatsapp);
  const newPhoto=profilePhoto.files?.[0]||null;
  if(!newPhoto&&!existing?.blob){alert('Sube una foto de perfil.');return}
  const btn=e.submitter;btn.disabled=true;btn.textContent='GUARDANDO...';
  if(newPhoto)await FSF.saveLocalFile('profile:'+state.whatsapp,newPhoto);
  const payload={
    firstName:firstName.value.trim(),lastName:lastName.value.trim(),nationality:nationality.value.trim(),
    age:one('age'),travelWith:one('travelWith'),interests:many('interests'),personality:many('personality'),
    about:about.value.trim(),tripId:state.tripId,profileComplete:true,profileCreatedAt:state.profileCreatedAt||new Date().toISOString()
  };
  state=FSF.writeState(payload);
  location.href='/perfil-listo.html'+(FSF.isTour()?'?tourframe=1':'');
};
</script>
</body>
</html>
