<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="/app.css"><title>Mi perfil</title><style>.profile{min-height:100svh;padding:18px 20px 108px;position:relative}.top-decor{position:absolute;right:-25px;top:42px;width:150px;height:118px;z-index:0}.top-decor:before{content:"";position:absolute;right:18px;top:0;width:95px;height:95px;border-radius:50%;background:var(--mustard)}.top-decor:after{content:"";position:absolute;right:-7px;bottom:8px;width:150px;height:54px;background:var(--olive);border-radius:70% 0 0 50%;transform:rotate(-16deg)}.profile .back-btn{position:relative;z-index:4}.profile-head{position:relative;z-index:2;margin:4px 0 18px 4px}.profile-head h1{font-size:50px;margin:0}.profile-head p{margin:0;font-size:16px}.form{position:relative;z-index:2;display:grid;gap:11px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.group{display:grid;gap:6px}.chips{display:flex;gap:6px;flex-wrap:wrap}.interest-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.interest{min-height:60px;border:1.7px solid #6a7470;border-radius:9px;background:rgba(255,250,235,.62);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;padding:4px;text-align:center}.interest b{font-size:22px;line-height:1.1}.interest.selected{background:var(--terracotta);color:#fff;border-color:var(--ink)}.personality{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.personality .chip{padding:7px 5px;font-size:11px;text-align:center}.profile .primary{margin-top:8px}@media(max-width:370px){.interest-grid{grid-template-columns:repeat(4,1fr)}.personality{grid-template-columns:repeat(3,1fr)}}</style></head><body><main class="app profile"><div class="top-decor"></div><a class="back-btn" href="/elegir-viaje">‹</a><div class="profile-head"><h1 class="retro-title">Mi perfil</h1><p>Cuéntanos un poco sobre ti.</p></div><form class="form" id="profileForm"><div class="two"><div><p class="small-label">Nombre</p><input class="field" id="firstName" placeholder="Tu nombre"></div><div><p class="small-label">Apellido</p><input class="field" id="lastName" placeholder="Tu apellido"></div></div><div><p class="small-label">Nacionalidad</p><input class="field" id="nationality" placeholder="Selecciona tu nacionalidad"></div><div class="group"><p class="small-label">Rango de edad</p><div class="chips" data-single="age"><button class="chip" type="button">18 - 29</button><button class="chip" type="button">30 - 44</button><button class="chip" type="button">45 - 59</button><button class="chip" type="button">60 - 69</button><button class="chip" type="button">70+</button></div></div><div class="group"><p class="small-label">¿Con quién viajas?</p><div class="chips" data-single="travelWith"><button class="chip" type="button">Solo/a</button><button class="chip" type="button">Amigos</button><button class="chip" type="button">Pareja</button><button class="chip" type="button">Familia</button><button class="chip" type="button">Otro</button></div></div><div class="group"><p class="small-label">Mis intereses</p><div class="interest-grid" data-multi="interests"><button type="button" class="interest"><b>🍴</b>Gastronomía</button><button type="button" class="interest"><b>🏛️</b>Cultura</button><button type="button" class="interest"><b>⛰️</b>Naturaleza</button><button type="button" class="interest"><b>🛍️</b>Compras</button><button type="button" class="interest"><b>♫</b>Música</button><button type="button" class="interest"><b>🎨</b>Arte</button><button type="button" class="interest"><b>📷</b>Fotografía</button><button type="button" class="interest"><b>📖</b>Historia</button><button type="button" class="interest"><b>🌙</b>Vida nocturna</button><button type="button" class="interest"><b>💬</b>Idiomas</button></div></div><div class="group"><p class="small-label">Mi personalidad</p><div class="personality" data-multi="personality"><button class="chip" type="button">Introvertido/a</button><button class="chip" type="button">Extrovertido/a</button><button class="chip" type="button">Tímido/a</button><button class="chip" type="button">Amistoso/a</button><button class="chip" type="button">Serio/a</button><button class="chip" type="button">Gracioso/a</button><button class="chip" type="button">Aventurero/a</button><button class="chip" type="button">Tranquilo/a</button><button class="chip" type="button">Estructurado/a</button><button class="chip" type="button">Relajado/a</button><button class="chip" type="button">Organizado/a</button><button class="chip" type="button">Espontáneo/a</button><button class="chip" type="button">Paciente</button><button class="chip" type="button">Impaciente</button><button class="chip" type="button">Rápido/a</button><button class="chip" type="button">Lento/a</button><button class="chip" type="button">Cariñoso/a</button><button class="chip" type="button">Reservado/a</button></div></div><div><p class="small-label">Cuéntale al grupo algo sobre ti</p><textarea class="field" id="about" placeholder="Escribe un poco sobre ti..."></textarea></div><button class="primary" type="submit">CONTINUAR</button></form><div class="bottom-wave"></div></main><script src="/app.js"></script><script>const s=FSF.requireUser();if(s){firstName.value=s.firstName||'';lastName.value=s.lastName||'';nationality.value=s.nationality||'';about.value=s.about||''}function setupSingle(key){const box=document.querySelector('[data-single="'+key+'"]');const current=FSF.readState()[key];box.querySelectorAll('button').forEach(b=>{if(b.textContent===current)b.classList.add('selected');b.onclick=()=>{box.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}})}function setupMulti(key){const box=document.querySelector('[data-multi="'+key+'"]');const current=FSF.readState()[key]||[];box.querySelectorAll('button').forEach(b=>{if(current.includes(b.textContent.trim()))b.classList.add('selected');b.onclick=()=>b.classList.toggle('selected')})}setupSingle('age');setupSingle('travelWith');setupMulti('interests');setupMulti('personality');profileForm.onsubmit=e=>{e.preventDefault();const one=k=>document.querySelector('[data-single="'+k+'"] .selected')?.textContent.trim()||'';const many=k=>[...document.querySelectorAll('[data-multi="'+k+'"] .selected')].map(x=>x.textContent.trim());FSF.writeState({firstName:firstName.value.trim(),lastName:lastName.value.trim(),nationality:nationality.value.trim(),age:one('age'),travelWith:one('travelWith'),interests:many('interests'),personality:many('personality'),about:about.value.trim(),profileComplete:true});alert('Perfil guardado ✓')};</script></body></html>
