<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5eddc">
<link rel="manifest" href="/manifest.webmanifest">
<title>Familia Sin Fronteras Travel App</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f4ecd9;color:#151515}
body{font-family:Arial,Helvetica,sans-serif;display:flex;justify-content:center}
.page{width:100%;min-height:100svh;display:flex;justify-content:center;background:#f4ecd9}
.artboard{
  position:relative;
  width:min(100vw,430px);
  aspect-ratio:564/1168;
  background:#f4ecd9;
  overflow:hidden;
}
.art{
  display:block;
  width:100%;
  height:auto;
  pointer-events:none;
  user-select:none;
}
.overlay{position:absolute;inset:0}
.tagline{
  position:absolute;
  top:52.2%;
  left:8%;
  right:8%;
  text-align:center;
  font-family:"Courier New",Courier,monospace;
  font-size:clamp(13px,3.5vw,15px);
  line-height:1.1;
  font-weight:700;
  letter-spacing:.01em;
}
.actions{
  position:absolute;
  left:7%;
  right:7%;
  top:58%;
  display:grid;
  gap:12px;
}
.actions a{
  height:58px;
  border:3px solid #151515;
  border-radius:18px;
  display:grid;
  place-items:center;
  text-decoration:none;
  color:#151515;
  font-weight:900;
  font-size:clamp(15px,4.2vw,18px);
  background:#dc6a40;
}
.actions a.secondary{background:#f4eadb}
</style>
</head>
<body>
<div class="page">
  <main class="artboard">
    <img class="art" src="/assets/welcome-art.png" alt="">
    <div class="overlay">
      <div class="tagline">Tu asistente de viaje grupal</div>
      <div class="actions">
        <a href="/crear-cuenta">CREAR USUARIO</a>
        <a class="secondary" href="/login">YA TENGO UNA CUENTA</a>
      </div>
    </div>
  </main>
</div>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(()=>{});
}
</script>
</body>
</html>
