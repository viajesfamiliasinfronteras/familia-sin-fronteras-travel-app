<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="/app.css"><title>Crear cuenta</title><style>.create{min-height:100svh;position:relative;background:var(--cream)}.create-art{position:absolute;top:0;left:0;width:100%;height:auto}.create-controls{position:relative;z-index:2;min-height:100svh}.create-top{position:absolute;top:16px;left:14px}.create-menu{position:absolute;top:16px;right:14px}.create-form{position:absolute;top:49.5%;left:24px;right:24px;display:grid;gap:12px}.create-form h1{font-size:40px;text-align:center;margin:0 0 6px}.password-wrap{position:relative}.password-wrap .field{padding-right:50px}.eye{position:absolute;right:8px;top:8px;width:40px;height:40px;border:0;background:transparent;font-size:20px}.error{font-size:13px;font-weight:700;color:#a93020;text-align:center;min-height:18px}</style></head><body><main class="app create"><img class="create-art" src="/assets/create-account-art.png" alt=""><div class="create-controls"><a class="back-btn create-top" href="/" aria-label="Volver">‹</a><button class="menu-btn create-menu">⋯</button><form class="create-form" id="form"><h1 class="retro-title">Crea tu cuenta</h1><input class="field" id="fullName" placeholder="Nombre y apellido" autocomplete="name" required><input class="field" id="whatsapp" placeholder="WhatsApp" inputmode="tel" autocomplete="tel" required><div class="password-wrap"><input class="field" id="password" type="password" placeholder="Contraseña" minlength="6" autocomplete="new-password" required><button class="eye" type="button" id="eye">◉</button></div><div class="error" id="error"></div><button class="primary" type="submit">CONTINUAR</button></form></div></main><script src="/app.js"></script><script>const p=document.getElementById('password');document.getElementById('eye').onclick=()=>p.type=p.type==='password'?'text':'password';document.getElementById('form').onsubmit=async e=>{e.preventDefault();const fullName=document.getElementById('fullName').value.trim();const whatsapp=document.getElementById('whatsapp').value.trim();if(!fullName||!whatsapp||p.value.length<6){document.getElementById('error').textContent='Completa los datos y usa al menos 6 caracteres.';return}const salt=crypto.randomUUID();const passwordHash=await FSF.hashPassword(p.value,salt);const n=FSF.splitName(fullName);FSF.writeState({userCreated:true,loggedIn:true,fullName,firstName:n.firstName,lastName:n.lastName,whatsapp,passwordSalt:salt,passwordHash});location.href='/elegir-viaje'};</script></body></html>
