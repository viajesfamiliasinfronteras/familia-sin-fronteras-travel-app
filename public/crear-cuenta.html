<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crear cuenta</title>
<link rel="stylesheet" href="/styles.css">
<style>
.top{position:absolute;top:18px;width:46px;height:46px;border:2px solid #141414;border-radius:16px;background:#f2eadb}
.back{left:16px}.menu{right:16px}
.form{position:absolute;left:24px;right:24px;top:41%;display:grid;gap:14px}
h1{text-align:center;margin:0 0 8px;font-size:34px}
input,.continue{height:58px;border:3px solid #141414;border-radius:18px}
input{padding:0 16px;background:#f2eadb}
.pw{position:relative}.pw input{width:100%;padding-right:48px}
.eye{position:absolute;right:10px;top:10px;width:38px;height:38px;border:0;background:transparent}
.continue{background:#d86b42;font-weight:900}
</style>
</head>
<body>
<main class="app">
<img class='bg' src='/create-account-bg.jpg' alt=''>
<div class="overlay">
  <button class="top back" onclick="history.back()">←</button>
  <button class="top menu" onclick="alert('Menú: siguiente bloque')">⋯</button>
  <form class="form" id="signup">
    <h1>Crea tu cuenta</h1>
    <input id="name" placeholder="Nombre y apellido">
    <input id="whatsapp" placeholder="WhatsApp" inputmode="tel">
    <div class="pw">
      <input id="password" type="password" placeholder="Contraseña">
      <button type="button" class="eye" id="eye">◉</button>
    </div>
    <button class="continue" type="submit">CONTINUAR</button>
  </form>
</div>
</main>
<script>
document.getElementById('eye').onclick = function() {
  const p = document.getElementById('password');
  p.type = p.type === 'password' ? 'text' : 'password';
};
document.getElementById('signup').onsubmit = function(e) {
  e.preventDefault();
  const name = document.getElementById('name').value.trim();
  const whatsapp = document.getElementById('whatsapp').value.trim();
  const password = document.getElementById('password').value;
  if (!name || !whatsapp || !password) {
    alert('Completa los tres campos');
    return;
  }
  localStorage.setItem('fsf_user', JSON.stringify({name:name, whatsapp:whatsapp}));
  alert('Cuenta guardada. Siguiente bloque: elegir viaje.');
};
</script>
</body>
</html>
