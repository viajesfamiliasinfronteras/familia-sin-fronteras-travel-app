<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crear cuenta</title>
<link rel="stylesheet" href="/styles.css">
<style>
.artboard{aspect-ratio:572/1168}
.icon{
  position:absolute;top:14px;width:44px;height:44px;border:2.5px solid #151515;
  border-radius:15px;background:#f4eadb;display:grid;place-items:center;font-size:21px;font-weight:700
}
.back{left:14px}.menu{right:14px}
.form{position:absolute;top:50.3%;left:6%;right:6%;display:grid;gap:12px}
h1{
  margin:0 0 8px;text-align:center;font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(29px,8vw,36px);line-height:1;font-weight:900
}
.field{position:relative}
input{
  width:100%;height:56px;border:3px solid #151515;border-radius:18px;background:#f4eadb;
  padding:0 18px;font-size:16px;outline:none
}
.eye{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  border:0;background:transparent;width:40px;height:40px;font-size:19px
}
.continue{
  height:56px;border:3px solid #151515;border-radius:18px;background:#dc6a40;
  color:#151515;font-size:17px;font-weight:900
}
</style>
</head>
<body>
<div class="page">
  <main class="artboard">
    <img class="art" src="/create-account-art.png" alt="">
    <div class="overlay">
      <button class="icon back" onclick="history.back()" aria-label="Volver">←</button>
      <button class="icon menu" aria-label="Menú">⋯</button>
      <form class="form" id="signup">
        <h1>Crea tu cuenta</h1>
        <div class="field"><input id="name" placeholder="Nombre y apellido" autocomplete="name"></div>
        <div class="field"><input id="whatsapp" value="+" placeholder="+5511999999999" inputmode="tel" autocomplete="tel"></div>
        <div class="field">
          <input id="password" type="password" placeholder="Contraseña" autocomplete="new-password">
          <button type="button" class="eye" id="eye" aria-label="Mostrar contraseña">◉</button>
        </div>
        <button class="continue" type="submit">CONTINUAR</button>
      </form>
    </div>
  </main>
</div>
<script>
function normalizePhone(value){
  const digits=String(value||'').replace(/\D/g,'');
  return digits ? '+'+digits : '+';
}
async function hashPassword(password,salt){
  const data=new TextEncoder().encode(salt+'::'+password);
  const digest=await crypto.subtle.digest('SHA-256',data);
  return Array.from(new Uint8Array(digest))
    .map(b=>b.toString(16).padStart(2,'0')).join('');
}
function makeSalt(){
  if(crypto.randomUUID) return crypto.randomUUID();
  const arr=new Uint32Array(4); crypto.getRandomValues(arr);
  return Array.from(arr).join('-');
}

const pass=document.getElementById('password');
const phone=document.getElementById('whatsapp');

phone.addEventListener('input',()=>{
  const n=normalizePhone(phone.value);
  phone.value=n;
  try{phone.setSelectionRange(n.length,n.length)}catch(e){}
});
phone.addEventListener('focus',()=>{
  if(!phone.value) phone.value='+';
});

document.getElementById('eye').onclick=()=>{
  pass.type=pass.type==='password'?'text':'password';
};

document.getElementById('signup').onsubmit=async(e)=>{
  e.preventDefault();

  const name=document.getElementById('name').value.trim();
  const whatsapp=normalizePhone(phone.value);
  const password=pass.value;

  if(!name || whatsapp.length<8 || !password){
    alert('Completa nombre, WhatsApp y contraseña.');
    return;
  }
  if(password.length<6){
    alert('La contraseña debe tener al menos 6 caracteres.');
    return;
  }

  const salt=makeSalt();
  const passwordHash=await hashPassword(password,salt);

  localStorage.setItem('fsf_user',JSON.stringify({
    name,
    whatsapp,
    passwordSalt:salt,
    passwordHash,
    userCreated:true,
    loggedIn:true,
    rememberMe:true,
    createdAt:new Date().toISOString()
  }));

  window.location.replace('/elegir-viaje.html?v=3');
};
</script>
</body>
</html>
