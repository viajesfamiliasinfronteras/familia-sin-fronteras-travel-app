<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crear cuenta</title>
<link rel="stylesheet" href="/styles.css">
<style>
.top{
 position:absolute;top:16px;width:46px;height:46px;border:2.5px solid #141414;
 border-radius:16px;background:#f3eadc;display:grid;place-items:center;font-size:22px;
}
.back{left:14px}.menu{right:14px}
.form{
 position:absolute;left:5%;right:5%;top:min(55.6vw,239px);
 display:grid;gap:13px;
}
h1{
 margin:0 0 7px;text-align:center;font-size:clamp(28px,8vw,34px);
 line-height:1;font-weight:900;
}
.field{position:relative}
input{
 width:100%;height:58px;border:3px solid #141414;border-radius:18px;
 background:#f3eadc;padding:0 18px;font-size:17px;outline:none;
}
input::placeholder{color:#777;opacity:1}
.eye{
 position:absolute;right:9px;top:50%;transform:translateY(-50%);
 width:38px;height:38px;border:0;background:transparent;font-size:20px;
}
.continue{
 height:58px;border:3px solid #141414;border-radius:18px;
 background:#dc6a40;font-weight:900;font-size:17px;
}
@media (min-width:430px){.form{top:239px}}
</style>
</head>
<body>
<main class="screen">
  <img class="art" src="/create-account-bg.png" alt="">
  <div class="layer">
    <button class="top back" onclick="history.back()" aria-label="Volver">←</button>
    <button class="top menu" onclick="alert('Menú: siguiente bloque')" aria-label="Menú">⋯</button>

    <form class="form" id="signup">
      <h1>Crea tu cuenta</h1>
      <div class="field"><input id="name" placeholder="Nombre y apellido" autocomplete="name"></div>
      <div class="field"><input id="whatsapp" placeholder="WhatsApp" inputmode="tel" autocomplete="tel"></div>
      <div class="field">
        <input id="password" type="password" placeholder="Contraseña" autocomplete="new-password">
        <button class="eye" type="button" id="eye" aria-label="Mostrar contraseña">◉</button>
      </div>
      <button class="continue" type="submit">CONTINUAR</button>
    </form>
  </div>
</main>

<script>
const p=document.getElementById('password');
document.getElementById('eye').onclick=function(){
  p.type=p.type==='password'?'text':'password';
};
document.getElementById('signup').onsubmit=function(e){
  e.preventDefault();
  const name=document.getElementById('name').value.trim();
  const whatsapp=document.getElementById('whatsapp').value.trim();
  const password=p.value;
  if(!name||!whatsapp||!password){alert('Completa los tres campos');return;}
  localStorage.setItem('fsf_user',JSON.stringify({name:name,whatsapp:whatsapp}));
  alert('Cuenta guardada. Siguiente bloque: elegir viaje.');
};
</script>
</body>
</html>
