<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Familia Sin Fronteras Travel App</title>
<link rel="stylesheet" href="/styles.css">
<style>
.artboard{aspect-ratio:564/1168}
.tagline{
  position:absolute;top:52.2%;left:8%;right:8%;text-align:center;
  font-family:"Courier New",Courier,monospace;font-size:clamp(13px,3.5vw,15px);
  line-height:1.1;font-weight:700;letter-spacing:.01em
}
.actions{position:absolute;left:7%;right:7%;top:58%;display:grid;gap:12px}
.actions a{
  height:58px;border:3px solid #151515;border-radius:18px;display:grid;place-items:center;
  text-decoration:none;color:#151515;font-weight:900;font-size:clamp(15px,4.2vw,18px);
  background:#dc6a40
}
.actions a.secondary{background:#f4eadb}
</style>
</head>
<body>
<div class="page">
  <main class="artboard">
    <img class="art" src="/welcome-art.png" alt="">
    <div class="overlay">
      <div class="tagline">Tu asistente de viaje grupal</div>
      <div class="actions">
        <a href="/crear-cuenta">CREAR USUARIO</a>
        <a class="secondary" href="#" onclick="return false;">YA TENGO UNA CUENTA</a>
      </div>
    </div>
  </main>
</div>
</body>
</html>
