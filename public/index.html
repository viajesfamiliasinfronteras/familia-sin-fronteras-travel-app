<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4ecd9">
<link rel="manifest" href="/manifest.webmanifest">
<title>Familia Sin Fronteras Travel App</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f4ecd9}
body{display:flex;justify-content:center;font-family:Arial,Helvetica,sans-serif;color:#111}
.screen{
  position:relative;
  width:min(100vw,430px);
  aspect-ratio:430/746;
  background:#f4ecd9;
  overflow:hidden;
}
.bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center top;
  display:block;
}
.tagline{
  position:absolute;
  top:50.7%;
  left:8%;
  right:8%;
  text-align:center;
  font-family:"Courier New",Courier,monospace;
  font-size:clamp(13px,3.6vw,15px);
  line-height:1.1;
  font-weight:700;
}
.actions{
  position:absolute;
  top:56.5%;
  left:7%;
  right:7%;
  display:grid;
  gap:12px;
}
.actions a{
  height:58px;
  border:3px solid #111;
  border-radius:20px;
  display:grid;
  place-items:center;
  text-decoration:none;
  color:#111;
  font-size:clamp(15px,4vw,18px);
  font-weight:900;
}
.actions .create{background:#df653b}
.actions .login{background:#f5ecde}
</style>
</head>
<body>
<main class="screen">
  <img class="bg" src="/welcome-bg.jpg" alt="">
  <div class="tagline">Tu asistente de viaje grupal</div>
  <div class="actions">
    <a class="create" href="/crear-cuenta">CREAR USUARIO</a>
    <a class="login" href="/login">YA TENGO UNA CUENTA</a>
  </div>
</main>
</body>
</html>
