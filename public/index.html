<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Familia Sin Fronteras Travel App</title>
<link rel="stylesheet" href="/styles.css">
<style>
.tagline{
  position:absolute;
  top:46.2vw;
  left:8%;
  right:8%;
  max-width:361px;
  margin:auto;
  text-align:center;
  font-family:"Courier New",Courier,monospace;
  font-size:clamp(13px,3.7vw,16px);
  line-height:1.2;
  font-weight:700;
  letter-spacing:.01em;
}
.actions{
  position:absolute;
  left:8.2%;
  right:8.2%;
  top:min(64.8vw,279px);
  display:grid;
  gap:12px;
}
.actions a{
  min-height:56px;
  border:3px solid #141414;
  border-radius:18px;
  display:grid;
  place-items:center;
  text-decoration:none;
  color:#141414;
  font-weight:900;
  font-size:clamp(14px,3.7vw,16px);
  background:#dc6a40;
}
.actions a.secondary{background:#f3eadc}
@media (min-width:430px){
  .tagline{top:199px;font-size:16px}
  .actions{top:279px}
}
</style>
</head>
<body>
<main class="screen">
  <img class="art" src="/welcome-bg.png" alt="">
  <div class="layer">
    <div class="tagline">Tu asistente de viaje grupal</div>
    <div class="actions">
      <a href="/crear-cuenta">CREAR USUARIO</a>
      <a class="secondary" href="#" onclick="alert('Inicio de sesión: siguiente bloque');return false;">YA TENGO UNA CUENTA</a>
    </div>
  </div>
</main>
</body>
</html>
