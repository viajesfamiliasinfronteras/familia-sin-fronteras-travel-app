<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4ecd9">
<title>Familia Sin Fronteras Travel App</title>
<style>
:root{
  --cream:#f4ecd9;
  --ink:#132018;
  --terracotta:#df6841;
  --mustard:#e7aa35;
  --olive:#6d7e50;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--cream);color:#111}
body{display:flex;justify-content:center;font-family:Arial,Helvetica,sans-serif}
.app{
  position:relative;
  width:min(100vw,430px);
  min-height:100svh;
  overflow:hidden;
  background:var(--cream);
}
.grid{
  position:absolute;
  inset:0;
  opacity:.98;
  background:
    repeating-linear-gradient(90deg,transparent 0 63px,var(--ink) 64px 67px),
    repeating-linear-gradient(0deg,transparent 0 63px,var(--ink) 64px 67px);
}
.center-blank{
  position:absolute;
  left:16%;
  right:16%;
  top:18%;
  bottom:21%;
  background:var(--cream);
}
.block{position:absolute;z-index:1}
.b1{left:7%;top:7%;width:15%;height:8%;background:var(--mustard)}
.b2{right:6%;top:7%;width:15%;height:8%;background:#e8572c}
.b3{left:7%;top:21%;width:15%;height:8%;background:var(--olive)}
.b4{right:6%;top:39%;width:15%;height:8%;background:var(--mustard)}
.b5{left:7%;top:48%;width:15%;height:8%;background:#e8572c}
.b6{right:6%;bottom:14%;width:15%;height:8%;background:var(--olive)}
.b7{left:27%;bottom:4%;width:15%;height:8%;background:#e8572c}

.logo{
  position:absolute;
  z-index:3;
  top:29%;
  left:50%;
  width:58%;
  transform:translateX(-50%);
  display:block;
}
.tagline{
  position:absolute;
  z-index:4;
  top:51.5%;
  left:7%;
  right:7%;
  text-align:center;
  font-family:"Courier New",Courier,monospace;
  font-size:clamp(13px,3.5vw,15px);
  line-height:1.1;
  font-weight:700;
}
.actions{
  position:absolute;
  z-index:5;
  top:58%;
  left:7%;
  right:7%;
  display:grid;
  gap:12px;
}
.actions a{
  height:58px;
  border:3px solid #111;
  border-radius:20px;
  display:grid;
  place-items:center;
  text-decoration:none;
  color:#111;
  font-size:clamp(15px,4vw,18px);
  font-weight:900;
}
.create{background:var(--terracotta)}
.login{background:#f6ecdf}
.stamps{
  position:absolute;
  z-index:4;
  left:50%;
  bottom:4.5%;
  width:84%;
  transform:translateX(-50%);
  display:block;
}
@media (min-height:800px){
  .logo{top:27%}
  .tagline{top:48%}
  .actions{top:54%}
  .stamps{bottom:5%}
}
</style>
</head>
<body>
<main class="app">
  <div class="grid"></div>
  <div class="center-blank"></div>

  <div class="block b1"></div><div class="block b2"></div>
  <div class="block b3"></div><div class="block b4"></div>
  <div class="block b5"></div><div class="block b6"></div>
  <div class="block b7"></div>

  <img class="logo" src="/assets/welcome-logo.jpg" alt="Familia Sin Fronteras Travel">
  <div class="tagline">Tu asistente de viaje grupal</div>

  <div class="actions">
    <a class="create" href="/crear-cuenta.html">CREAR USUARIO</a>
    <a class="login" href="/login.html">YA TENGO UNA CUENTA</a>
  </div>

  <img class="stamps" src="/assets/welcome-stamps.jpg" alt="">
</main>
</body>
</html>
