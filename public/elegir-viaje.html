<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="/app.css"><title>Elige tu viaje</title><style>.choose{min-height:100svh;padding:22px 18px 128px;position:relative}.choose .back-btn{position:relative;z-index:3;margin-bottom:12px}.choose-head{position:relative;z-index:2;text-align:center;margin:8px 8px 26px}.choose-head h1{font-size:45px;margin:0 0 10px}.choose-head p{font-size:16px;margin:0}.trip-list{position:relative;z-index:2;display:grid;gap:11px}.trip-card{display:grid;grid-template-columns:44% 1fr 32px;align-items:center;min-height:112px;background:rgba(255,249,233,.9);border:2.5px solid var(--ink);border-radius:18px;padding:7px;cursor:pointer}.trip-card img{width:100%;height:96px;object-fit:cover;border-radius:12px}.trip-text{padding:0 10px}.trip-text strong{display:block;font-family:"DM Serif Display",serif;font-size:28px;line-height:1}.trip-text span{font-size:19px}.chev{font-size:42px;font-weight:300;line-height:1}.trip-card.selected{box-shadow:0 0 0 4px rgba(222,91,50,.28)}.choose .primary{position:relative;z-index:2;margin-top:18px}</style></head><body><main class="app choose"><div class="grid-bg"></div><a class="back-btn" href="/crear-cuenta.html">‹</a><div class="choose-head"><h1 class="retro-title">¿Cuál es tu<br>viaje grupal?</h1><p>Selecciona el grupo al que ya estás inscrito.</p></div><div class="trip-list" id="list"><div class="trip-card" data-id="japon-oct-2026"><img src="/assets/japon-octubre.jpg"><div class="trip-text"><strong>Japón</strong><span>Octubre 2026</span></div><div class="chev">›</div></div><div class="trip-card" data-id="japon-ene-2027"><img src="/assets/japon-enero.jpg"><div class="trip-text"><strong>Japón</strong><span>Enero 2027</span></div><div class="chev">›</div></div><div class="trip-card" data-id="islandia-feb-2027"><img src="/assets/islandia.jpg"><div class="trip-text"><strong>Islandia</strong><span>Febrero 2027</span></div><div class="chev">›</div></div><div class="trip-card" data-id="china-abr-2027"><img src="/assets/china.jpg"><div class="trip-text"><strong>China</strong><span>Abril 2027</span></div><div class="chev">›</div></div></div><button class="primary" id="continue">CONTINUAR</button><div class="bottom-sun"></div><div class="bottom-wave"></div></main><script src="/app.js"></script><script>const s=FSF.requireUser();
if(s?.tripId&&s?.profileComplete&&!new URLSearchParams(location.search).has('edit')){location.replace('/mi-viaje.html')}
let selected=s?.tripId||null;
function chooseTrip(id){
  selected=id;
  document.querySelectorAll('.trip-card').forEach(x=>x.classList.toggle('selected',x.dataset.id===selected));
  FSF.writeState({tripId:selected,tripJoinedAt:s?.tripJoinedAt||new Date().toISOString()});
  localStorage.setItem('fsf_trip',selected);
  location.href='/mi-perfil.html';
}
document.querySelectorAll('.trip-card').forEach(c=>{
  if(c.dataset.id===selected)c.classList.add('selected');
  c.onclick=()=>chooseTrip(c.dataset.id);
});
document.getElementById('continue').onclick=()=>{
  if(!selected){alert('Selecciona tu viaje.');return}
  chooseTrip(selected);
};</script></body></html>
