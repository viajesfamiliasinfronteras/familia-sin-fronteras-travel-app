<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ingresar</title>
<link rel="stylesheet" href="/styles.css">
<style>
body{background:#f4eadb}
.login{
  position:relative;
  width:100%;
  min-height:100svh;
  padding:22px 24px 50px;
  background:#f4eadb;
  overflow:hidden;
}
.grid{
  position:absolute;
  left:0;right:0;top:0;height:300px;
  opacity:.38;
  background:
    repeating-linear-gradient(90deg,transparent 0 52px,#da6d45 53px 56px),
    repeating-linear-gradient(0deg,transparent 0 52px,#da6d45 53px 56px);
}
.content{position:relative;z-index:2}
.back{
  width:46px;height:46px;border:2.5px solid #151515;border-radius:16px;
  background:#f3eadc;display:grid;place-items:center;font-size:22px;
  text-decoration:none;color:#151515;
}
h1{
  margin:94px 0 8px;
  text-align:center;
  font-family:Georgia,"Times New Roman",serif;
  font-size:42px;line-height:1;font-weight:900;
}
.sub{
  margin:0 0 28px;
  text-align:center;
  font-family:"Courier New",Courier,monospace;
  font-weight:700;
}
form{display:grid;gap:13px}
.field{position:relative}
input{
  width:100%;height:58px;border:3px solid #151515;border-radius:18px;
  background:#f3eadc;padding:0 18px;font-size:17px;outline:none;
}
.eye{
  position:absolute;right:9px;top:50%;transform:translateY(-50%);
  width:38px;height:38px;border:0;background:transparent;font-size:20px;
}
.primary{
  height:58px;border:3px solid #151515;border-radius:18px;
  background:#dc6a40;font-weight:900;font-size:17px;
}
.error{min-height:18px;text-align:center;font-size:13px;font-weight:700;color:#a12d20}
.wave{
  position:absolute;left:-30px;right:-30px;bottom:-65px;height:130px;
  background:#65784a;border-radius:50% 50% 0 0/45% 45% 0 0;
  transform:rotate(-2deg);
}
</style>
</head>
<body>
<main class="login">
  <div class="grid"></div>
  <div class="content">
    <a class="back" href="/" aria-label="Volver">←</a>

    <h1>Bienvenido/a</h1>
    <p class="sub">Entra a tu viaje grupal</p>

    <form id="loginForm">
      <input id="whatsapp" placeholder="WhatsApp" inputmode="tel" autocomplete="tel" required>

      <div class="field">
        <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" required>
        <button class="eye" id="eye" type="button" aria-label="Mostrar contraseña">◉</button>
      </div>

      <div class="error" id="error"></div>
      <button class="primary" type="submit">ENTRAR</button>
    </form>
  </div>
  <div class="wave"></div>
</main>

<script>
async function fsfHashPassword(password, salt){
  const data = new TextEncoder().encode(salt + "::" + password);
  const digest = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(digest))
    .map(b => b.toString(16).padStart(2,"0")).join("");
}
function fsfSalt(){
  if (crypto.randomUUID) return crypto.randomUUID();
  const a = new Uint32Array(4);
  crypto.getRandomValues(a);
  return Array.from(a).join("-");
}

const pw=document.getElementById('password');
document.getElementById('eye').onclick=()=>{pw.type=pw.type==='password'?'text':'password'};

document.getElementById('loginForm').onsubmit=async (e)=>{
  e.preventDefault();

  const whatsapp=document.getElementById('whatsapp').value.trim();
  const password=pw.value;
  const error=document.getElementById('error');

  let user=null;
  try{ user=JSON.parse(localStorage.getItem('fsf_user')||'null'); }catch(_){}

  if(!user){
    error.textContent='No encontramos un usuario en este dispositivo.';
    return;
  }

  if(String(user.whatsapp||'').trim() !== whatsapp){
    error.textContent='El WhatsApp no coincide con el usuario guardado.';
    return;
  }

  // Migrates accounts created before password storage was enabled.
  if(!user.passwordHash || !user.passwordSalt){
    const salt=fsfSalt();
    user.passwordSalt=salt;
    user.passwordHash=await fsfHashPassword(password,salt);
    user.userCreated=true;
    user.loggedIn=true;
    localStorage.setItem('fsf_user',JSON.stringify(user));
  } else {
    const hash=await fsfHashPassword(password,user.passwordSalt);
    if(hash !== user.passwordHash){
      error.textContent='Contraseña incorrecta.';
      return;
    }
    user.loggedIn=true;
    localStorage.setItem('fsf_user',JSON.stringify(user));
  }

  location.href = localStorage.getItem('fsf_trip')
    ? '/mi-perfil.html'
    : '/elegir-viaje.html';
};
</script>
</body>
</html>
